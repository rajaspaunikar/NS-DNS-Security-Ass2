options {
    directory "/var/cache/bind";
    listen-on { 172.16.2.10; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    dnssec-validation no;   // flip to 'yes' + add trust-anchors in Phase 3
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
